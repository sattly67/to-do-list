<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 To-Do Galaksi</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow-x: hidden;
            position: relative;
        }
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle 3s infinite alternate; opacity: 0.3;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        .container {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            box-shadow: 0 0 40px rgba(0, 200, 255, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            max-width: 550px;
            width: 100%;
            position: relative;
            z-index: 1;
            color: white;
            transition: all 0.3s ease;
        }
        .container:hover {
            box-shadow: 0 0 60px rgba(180, 0, 255, 0.4), inset 0 0 25px rgba(255, 255, 255, 0.15);
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 15px #a020f0, 0 0 30px #00ffff;
            margin-bottom: 10px;
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .tanggal {
            text-align: center;
            color: #b0c4de;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }
        .progress-container {
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            height: 22px;
            margin: 20px 0;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff00ff, #00ffff);
            box-shadow: 0 0 20px #ff00ff, 0 0 40px #00ffff;
            border-radius: 20px;
            transition: width 0.4s ease;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.9; }
            50% { opacity: 1; box-shadow: 0 0 30px #ff00ff, 0 0 60px #00ffff; }
            100% { opacity: 0.9; }
        }
        .progress-text {
            text-align: center;
            font-weight: 600;
            color: #e0ffff;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        ul { list-style: none; padding: 0; }
        li {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(5px);
            margin: 10px 0;
            padding: 14px 18px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.15);
            position: relative;
            overflow: hidden;
        }
        li:hover {
            background: rgba(255,255,255,0.2);
            transform: translateX(8px);
            border-color: rgba(255,255,255,0.4);
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.2);
        }
        input[type="checkbox"] {
            width: 22px; height: 22px; margin-right: 15px;
            accent-color: #ff00ff; cursor: pointer;
            filter: drop-shadow(0 0 5px #ff00ff);
            transition: transform 0.2s;
        }
        input[type="checkbox"]:checked {
            transform: scale(1.2);
            animation: spark 0.4s ease;
        }
        @keyframes spark {
            0% { transform: scale(1); box-shadow: 0 0 0px #00ffff; }
            50% { transform: scale(1.3); box-shadow: 0 0 25px #00ffff; }
            100% { transform: scale(1.2); box-shadow: 0 0 10px #00ffff; }
        }
        .task-label {
            flex: 1;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.3px;
            color: #e6f0ff;
            transition: all 0.3s;
        }
        .completed {
            text-decoration: line-through;
            color: #a9c2d9;
            opacity: 0.7;
            animation: completeGlow 0.5s;
        }
        @keyframes completeGlow {
            0% { text-shadow: 0 0 10px #00ffff; }
            100% { text-shadow: none; }
        }
        .reset-btn, .edit-btn {
            border: none; padding: 12px 20px; border-radius: 30px;
            cursor: pointer; margin-top: 12px; width: 100%;
            font-size: 16px; font-weight: 600;
            transition: all 0.3s; color: white;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3);
        }
        .reset-btn { background: rgba(231, 76, 60, 0.3); }
        .reset-btn:hover {
            background: rgba(231, 76, 60, 0.6);
            box-shadow: 0 0 25px #e74c3c;
            border-color: #e74c3c;
        }
        .edit-btn { background: rgba(52, 152, 219, 0.3); }
        .edit-btn:hover {
            background: rgba(52, 152, 219, 0.6);
            box-shadow: 0 0 25px #3498db;
            border-color: #3498db;
        }
        .history-section {
            margin-top: 30px;
            border-top: 1px solid rgba(255,255,255,0.2);
            padding-top: 20px;
        }
        .history-section h2 {
            font-family: 'Orbitron', sans-serif;
            color: #e0ffff; font-size: 1.2rem; margin-bottom: 15px;
            text-shadow: 0 0 10px #ff00ff;
        }
        .history-list { max-height: 180px; overflow-y: auto; padding-right: 5px; }
        .history-item {
            display: flex; justify-content: space-between; padding: 10px;
            background: rgba(255,255,255,0.05); border-radius: 10px;
            margin-bottom: 5px; font-size: 14px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .history-date { color: #a0c4ff; }
        .history-progress { font-weight: bold; color: #00ffff; text-shadow: 0 0 8px #00ffff; }
        .no-history { color: #a0b0c0; font-style: italic; text-align: center; padding: 10px; }

        /* Modal */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0;
            width: 100%; height: 100%; overflow: auto;
            background-color: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
        }
        .modal-content {
            background: rgba(20,20,40,0.9);
            backdrop-filter: blur(25px);
            margin: 10% auto; padding: 25px;
            border-radius: 25px; width: 90%; max-width: 500px;
            border: 1px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 50px rgba(100,0,255,0.5);
            color: white;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; }
        .close { color: #ff69b4; font-size: 28px; font-weight: bold; cursor: pointer; }
        .close:hover { color: #ff1493; }
        .task-edit-item { display: flex; gap: 8px; margin: 10px 0; }
        .task-edit-item input {
            flex: 1; padding: 10px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1); color: white;
        }
        .btn-delete { background: #e74c3c; color: white; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
        .btn-add { background: #2ecc71; color: white; border: none; border-radius: 20px; padding: 10px; width: 100%; margin-top: 10px; cursor: pointer; }
        .btn-save { background: #9b59b6; color: white; border: none; border-radius: 20px; padding: 12px; width: 100%; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="stars" id="starsContainer"></div>

    <div class="container">
        <h1>🌙 To-Do Galaksi</h1>
        <p class="tanggal" id="tanggal"></p>
        <div class="progress-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="progress-text" id="progressText">0% Selesai</p>
        <ul id="taskList"></ul>
        <button class="reset-btn" onclick="resetHarian()">🔄 Reset Hari Ini</button>
        <button class="edit-btn" onclick="bukaEditorTugas()">✏️ Edit Daftar Tugas</button>

        <div class="history-section">
            <h2>📆 Riwayat Progres</h2>
            <div class="history-list" id="historyList"></div>
        </div>
    </div>

    <!-- Modal Editor -->
    <div id="editorModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Edit Tugas</h2>
                <span class="close" onclick="tutupEditor()">&times;</span>
            </div>
            <div id="editorList"></div>
            <button class="btn-add" onclick="tambahTugas()">➕ Tambah Baru</button>
            <button class="btn-save" onclick="simpanTugas()">💾 Simpan</button>
        </div>
    </div>

    <script>
        function createStars() {
            const container = document.getElementById('starsContainer');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                star.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(star);
            }
        }
        createStars();

        const defaultTugas = [
            "Bangun & mandi pagi (05.00-05.30)",
            "Sarapan & cek perlengkapan sekolah (05.30-06.00)",
            "Sekolah hingga pukul 15.30",
            "Membersihkan rumah (16.00-17.00)",
            "Mandi sore & istirahat (17.00-18.00)",
            "Makan malam (18.00-18.30)",
            "Sesi Belajar 1 (18.30-19.15)",
            "Sesi Belajar 2 (19.30-20.15)",
            "Waktu bebas (20.15-21.00)",
            "Persiapan tidur & tidur tepat waktu (21.30)"
        ];
        const STORAGE_TUGAS = 'todolist_daftar_tugas_v2';
        const STORAGE_KEY_TODAY = 'todolist_today_data_v2';
        const DATE_KEY = 'todolist_today_date_v2';
        const HISTORY_KEY = 'todolist_history_v2';

        function getDaftarTugas() {
            const saved = localStorage.getItem(STORAGE_TUGAS);
            return saved ? JSON.parse(saved) : [...defaultTugas];
        }
        function simpanDaftarTugas(daftar) { localStorage.setItem(STORAGE_TUGAS, JSON.stringify(daftar)); }
        function getTodayString() {
            const d = new Date();
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }
        function loadTodayData() {
            const todayStr = getTodayString();
            const savedDate = localStorage.getItem(DATE_KEY);
            const tugas = getDaftarTugas();
            if (savedDate !== todayStr) {
                const data = new Array(tugas.length).fill(false);
                localStorage.setItem(DATE_KEY, todayStr);
                localStorage.setItem(STORAGE_KEY_TODAY, JSON.stringify(data));
                return data;
            } else {
                const saved = localStorage.getItem(STORAGE_KEY_TODAY);
                if (saved) {
                    let data = JSON.parse(saved);
                    if (data.length !== tugas.length) {
                        data = new Array(tugas.length).fill(false);
                        localStorage.setItem(STORAGE_KEY_TODAY, JSON.stringify(data));
                    }
                    return data;
                } else {
                    const data = new Array(tugas.length).fill(false);
                    localStorage.setItem(STORAGE_KEY_TODAY, JSON.stringify(data));
                    return data;
                }
            }
        }
        function saveTodayData(data) { localStorage.setItem(STORAGE_KEY_TODAY, JSON.stringify(data)); }
        function getHistory() {
            const saved = localStorage.getItem(HISTORY_KEY);
            return saved ? JSON.parse(saved) : {};
        }
        function saveHistory(dateStr, data) {
            const history = getHistory();
            history[dateStr] = data;
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }

        function renderList() {
            const tugas = getDaftarTugas();
            const data = loadTodayData();
            const listEl = document.getElementById('taskList');
            listEl.innerHTML = '';
            data.forEach((selesai, index) => {
                if (index >= tugas.length) return;
                const li = document.createElement('li');
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = selesai;
                checkbox.addEventListener('change', () => {
                    data[index] = checkbox.checked;
                    saveTodayData(data);
                    saveHistory(getTodayString(), data);
                    updateProgress(data);
                    renderList();
                });
                const label = document.createElement('span');
                label.className = 'task-label' + (selesai ? ' completed' : '');
                label.textContent = tugas[index];
                li.appendChild(checkbox);
                li.appendChild(label);
                listEl.appendChild(li);
            });
            updateProgress(data);
            saveHistory(getTodayString(), data);
            renderHistory();
        }

        function updateProgress(data) {
            const tugas = getDaftarTugas();
            const selesaiCount = data.filter((d,i) => i < tugas.length && d === true).length;
            const total = tugas.length;
            const persen = total === 0 ? 0 : Math.round((selesaiCount / total) * 100);
            document.getElementById('progressBar').style.width = persen + '%';
            document.getElementById('progressText').textContent = persen + '% Selesai (' + selesaiCount + '/' + total + ')';
        }

        function renderHistory() {
            const history = getHistory();
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            const dates = Object.keys(history).sort().reverse();
            if (dates.length === 0) {
                list.innerHTML = '<div class="no-history">Belum ada riwayat.</div>';
                return;
            }
            const recentDates = dates.slice(0, 7);
            recentDates.forEach(dateStr => {
                const data = history[dateStr];
                const tugas = getDaftarTugas();
                const selesai = data.filter((v,i) => i < tugas.length && v === true).length;
                const total = tugas.length;
                const persen = total === 0 ? 0 : Math.round((selesai / total) * 100);
                const item = document.createElement('div');
                item.className = 'history-item';
                item.innerHTML = `<span class="history-date">${formatTanggal(dateStr)}</span><span class="history-progress">${persen}% (${selesai}/${total})</span>`;
                list.appendChild(item);
            });
        }

        function formatTanggal(dateStr) {
            const parts = dateStr.split('-');
            const bulan = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
            return `${parts[2]} ${bulan[parseInt(parts[1],10)-1]} ${parts[0]}`;
        }

        function resetHarian() {
            if (confirm('Reset checklist hari ini?')) {
                const todayStr = getTodayString();
                const tugas = getDaftarTugas();
                const fresh = new Array(tugas.length).fill(false);
                localStorage.setItem(STORAGE_KEY_TODAY, JSON.stringify(fresh));
                const history = getHistory();
                history[todayStr] = fresh;
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
                renderList();
            }
        }

        let editorTugas = [];
        function bukaEditorTugas() {
            editorTugas = [...getDaftarTugas()];
            renderEditor();
            document.getElementById('editorModal').style.display = 'block';
        }
        function tutupEditor() { document.getElementById('editorModal').style.display = 'none'; }
        function renderEditor() {
            const container = document.getElementById('editorList');
            container.innerHTML = '';
            editorTugas.forEach((teks, idx) => {
                const div = document.createElement('div');
                div.className = 'task-edit-item';
                div.innerHTML = `
                    <input type="text" value="${teks}" onchange="editorTugas[${idx}] = this.value">
                    <button class="btn-delete" onclick="hapusTugas(${idx})">❌</button>
                `;
                container.appendChild(div);
            });
        }
        function tambahTugas() { editorTugas.push(''); renderEditor(); }
        function hapusTugas(index) { editorTugas.splice(index, 1); renderEditor(); }
        function simpanTugas() {
            const inputs = document.querySelectorAll('#editorList input');
            for (let i = 0; i < inputs.length; i++) editorTugas[i] = inputs[i].value.trim();
            const bersih = editorTugas.filter(t => t !== '');
            if (bersih.length === 0) { alert('Minimal satu tugas!'); return; }
            simpanDaftarTugas(bersih);
            const todayStr = getTodayString();
            const fresh = new Array(bersih.length).fill(false);
            localStorage.setItem(STORAGE_KEY_TODAY, JSON.stringify(fresh));
            const history = getHistory();
            history[todayStr] = fresh;
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            tutupEditor();
            renderList();
        }
        window.onclick = function(event) {
            const modal = document.getElementById('editorModal');
            if (event.target == modal) tutupEditor();
        }

        document.getElementById('tanggal').textContent = new Date().toLocaleDateString('id-ID', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
        renderList();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('SW registered'))
                    .catch(err => console.log('SW failed', err));
            });
        }
    </script>
</body>
</html>
