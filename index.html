<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌌 To-Do Galaksi - Selamat Datang</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            position: relative;
        }
        .stars {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .star {
            position: absolute; background: white; border-radius: 50%;
            animation: twinkle 3s infinite alternate; opacity: 0.3;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.2); }
        }
        .splash-screen {
            position: relative; z-index: 1;
            text-align: center; color: white;
            max-width: 400px; width: 100%;
        }
        .rocket {
            font-size: 4rem;
            animation: float 3s ease-in-out infinite;
            display: block;
            margin-bottom: 20px;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.4rem;
            text-shadow: 0 0 20px #a020f0, 0 0 40px #00ffff;
            margin-bottom: 15px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #b0c4de;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn-mulai {
            display: inline-block;
            padding: 14px 40px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            font-weight: 700;
            text-decoration: none;
            color: white;
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            border: none;
            border-radius: 50px;
            box-shadow: 0 0 30px #ff00ff, 0 0 60px #00ffff;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .btn-mulai:hover {
            transform: scale(1.05);
            box-shadow: 0 0 50px #ff00ff, 0 0 80px #00ffff;
        }
        .loading-screen {
            position: relative; z-index: 1;
            text-align: center; color: white;
            display: none;
        }
        .logo-splash {
            font-size: 5rem;
            animation: pulse 1.5s ease-in-out infinite;
            display: block;
            margin-bottom: 20px;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 30px #ff00ff; }
            100% { transform: scale(1); opacity: 0.8; }
        }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top: 4px solid #ff00ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.2rem;
            color: #e0ffff;
            text-shadow: 0 0 10px #ff00ff;
        }
    </style>
</head>
<body>
    <div class="stars" id="starsContainer"></div>

    <!-- Splash Screen -->
    <div class="splash-screen" id="splashScreen">
        <span class="rocket">🚀</span>
        <h1>To-Do Galaksi</h1>
        <p class="subtitle">
            Atur waktumu, jelajahi produktivitasmu.<br>
            🌙✨
        </p>
        <button class="btn-mulai" onclick="mulai()">Mulai</button>
    </div>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loadingScreen">
        <span class="logo-splash">🌌</span>  <!-- Bisa diganti <img src="logo-splash.png" class="logo-splash" style="width:120px;"> -->
        <div class="spinner"></div>
        <p class="loading-text">Menjelajahi Galaksi...</p>
    </div>

    <script>
        function createStars() {
            const container = document.getElementById('starsContainer');
            for (let i = 0; i < 80; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDuration = (Math.random() * 3 + 2) + 's';
                star.style.animationDelay = Math.random() * 5 + 's';
                container.appendChild(star);
            }
        }
        createStars();

        function mulai() {
            document.getElementById('splashScreen').style.display = 'none';
            document.getElementById('loadingScreen').style.display = 'block';
            setTimeout(() => {
                window.location.replace('todo.html');
            }, 2500);
        }
    </script>
</body>
</html>
